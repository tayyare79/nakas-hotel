name: Site check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages are up to date
        run: |
          python3 tools/build_site.py
          git diff --exit-code
      - name: Validate links, hreflang, canonicals, JSON-LD and sitemap
        run: python3 tools/check_site.py
